<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview GitHub Profile - Phùng Quốc Việt</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .preview-header {
      width: 100%;
      max-width: 940px;
      margin-bottom: 20px;
      padding: 16px 20px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #30363d;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
    }
    .preview-header h1 {
      font-size: 18px;
      margin: 0;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-status {
      background: #238636;
      color: white;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .markdown-body {
      box-sizing: border-box;
      width: 100%;
      max-width: 940px;
      margin: 0 auto;
      padding: 40px;
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    .markdown-body table th, .markdown-body table td {
      border: 1px solid #30363d;
      padding: 10px 14px;
    }
    .markdown-body table th {
      background-color: #161b22;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="preview-header">
    <h1>
      <svg height="24" viewBox="0 0 16 16" version="1.1" width="24" fill="#58a6ff">
        <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
      </svg>
      vietdezet2004 / README.md - Live Preview
    </h1>
    <span class="badge-status">Sẵn sàng xuất bản</span>
  </div>

  <article id="content" class="markdown-body">
    Đang tải nội dung...
  </article>

  <script>
    fetch('README.md')
      .then(res => res.text())
      .then(markdown => {
        document.getElementById('content').innerHTML = marked.parse(markdown);
      })
      .catch(err => {
        document.getElementById('content').innerHTML = '<p style="color:red">Lỗi tải README.md: ' + err + '</p>';
      });
  </script>
</body>
</html>
